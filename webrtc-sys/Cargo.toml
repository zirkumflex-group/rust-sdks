[package]
name = "webrtc-sys"
version = "0.3.53"
edition.workspace = true
homepage = "https://livekit.io"
license.workspace = true
description = "Unsafe bindings to libwebrtc"
repository.workspace = true

[features]
default = []
# Leave libaom's software AV1 encoder out, so AV1 is negotiated only when a
# hardware encoder (NVENC, VideoToolbox, ...) offers it. Software AV1 is too
# slow for real-time screen sharing; VP8/VP9 remain available.
no-software-av1-encoder = []

# How CI checks this crate's features, read by
# `.github/workflows/feature-combinations-curated.yml` via `cargo metadata`.
[package.metadata.feature-combinations]
mode = "powerset"

[dependencies]
cxx = "1.0"
log = { workspace = true }

[build-dependencies]
webrtc-sys-build = { workspace = true }
cxx-build = "1.0"
glob = "0.3"
cc = { workspace = true }
pkg-config = "0.3.22"

[target.'cfg(target_os = "linux")'.build-dependencies]
pkg-config = "0.3.22"
